# Tests the sharing engine against TabExplorer's own share.js, builds the Android app, and publishes
# the APK as the release "latest" (Releases -> latest). Sideload it; each build installs over the last.
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Tests (sharing against TabExplorer's share.js, files, Recycle Bin)
        run: gradle --no-daemon :share:test :core:test
      - name: Build the app
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-reports, path: "share/build/reports/tests\ncore/build/reports/tests" }
      - name: Publish the APK as the release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          NAME="TabExplorer-Android-0.1.${RUN_NUMBER}.apk"
          cp "$APK" "$NAME"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "TabExplorer for Android" --notes "The newest build."
          for old in $(gh release view latest --json assets --jq '.assets[].name'); do gh release delete-asset latest "$old" -y; done
          gh release upload latest "$NAME" --clobber
          gh release edit latest --title "TabExplorer for Android build ${RUN_NUMBER}" --notes "$(printf 'Build %s. Install the APK on the phone (it installs over the last one).\n\n%s' "$RUN_NUMBER" "$(cat CHANGELOG.md 2>/dev/null | head -30)")"

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: The app on an emulator (files, viewers, music, sharing with TabExplorer's real code)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/ci/emulator-setup.sh
