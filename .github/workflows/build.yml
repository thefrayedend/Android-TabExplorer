# Tests the sharing engine against TabExplorer's own share.js, builds the Android app,
# and publishes the APK as the release "latest" (Releases -> latest).
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Sharing tests (our code against TabExplorer's share.js)
        run: gradle --no-daemon :share:test :core:test :app:assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: share-test-reports, path: share/build/reports/tests }
